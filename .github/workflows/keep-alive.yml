# Giữ app trên Render (gói free) không bị ngủ: Render tắt service sau ~15 phút không có request.
# Cứ ~10 phút gọi /api/auth (API nhẹ, không cần đăng nhập) một lần.
# Cấu hình: GitHub repo -> Settings -> Secrets and variables -> Actions -> Variables -> RENDER_URL
#           (vd https://my-music.onrender.com, không có / ở cuối)
name: Keep Render awake

on:
  schedule:
    - cron: '*/10 * * * *' # GitHub có thể chạy trễ vài phút lúc đông
  workflow_dispatch: # cho phép bấm chạy tay ở tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping
        env:
          URL: ${{ vars.RENDER_URL }}
        run: |
          if [ -z "$URL" ]; then echo "Chưa đặt biến RENDER_URL"; exit 1; fi
          # Lần đầu app đang ngủ có thể mất ~1 phút để khởi động -> chờ tối đa 120s, thử lại 3 lần
          curl -fsS --retry 3 --retry-delay 10 --max-time 120 "$URL/api/auth" && echo " OK"
